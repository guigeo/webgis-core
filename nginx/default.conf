server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log geo_core;

    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    add_header Content-Security-Policy "${NGINX_CONTENT_SECURITY_POLICY}" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api_per_ip burst=${NGINX_API_BURST} nodelay;
        limit_req_status 429;
        limit_conn api_connections_per_ip ${NGINX_API_CONNECTIONS};
        limit_conn_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        internal;
        default_type application/json;
        add_header Content-Security-Policy "${NGINX_CONTENT_SECURITY_POLICY}" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Retry-After "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Request-ID $correlation_id always;
        add_header X-XSS-Protection "0" always;
        return 429 '{"detail":"Too many requests","requestId":"$correlation_id"}\n';
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

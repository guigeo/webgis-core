limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=${NGINX_API_RATE};
limit_conn_zone $binary_remote_addr zone=api_connections_per_ip:10m;

map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $http_x_request_id;
}

log_format geo_core escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time'
    '}';

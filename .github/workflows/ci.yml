name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: geo_core
          POSTGRES_USER: geo_core
          POSTGRES_PASSWORD: geo_core_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_core -d geo_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://geo_core:geo_core_ci_admin@localhost:5432/geo_core
      DATABASE_RUNTIME_USER: geo_core_app
      DATABASE_RUNTIME_PASSWORD: geo_core_ci_runtime
      TEST_DATABASE_URL: postgresql+psycopg://geo_core_app:geo_core_ci_runtime@localhost:5432/geo_core
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Prepare PostGIS permissions
        run: |
          python -m app.core.database_access ensure-role
          alembic upgrade head
          python -m app.core.database_access grant-access

      - name: Run tests
        run: pytest

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start integrated stack
        run: docker compose up -d --build

      - name: Test gateway security
        run: sh scripts/test-gateway.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integrated stack
        if: always()
        run: docker compose down -v
